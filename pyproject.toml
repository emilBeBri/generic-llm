[project]
name = "generic-llm"
version = "0.1.0"
description = "gllm — a minimal Unix-pipe-friendly CLI for calling LLMs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # No vendor SDKs. Every provider is JSON over HTTPS through `gllm._http`
    # (stdlib `http.client`), which cut per-call startup from ~0.9-1.5s to
    # ~0.11s: `import anthropic` alone built 462 pydantic classes and loaded
    # 1247 modules to round-trip a dict the adapters already had. The full
    # reasoning, and the per-provider wire gotchas that came out of it, are in
    # .llm-memory/ADR-stdlib-http-transport.md. Do not add one back to get at a
    # convenience method — check what it actually does on the wire first.
    "llm-price-tracker",
]

[project.scripts]
gllm = "gllm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gllm"]

[tool.uv.sources]
llm-price-tracker = { path = "../llm-price-tracker", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# Collect ONLY this repo's suite. `symlinks/` holds links to sibling repos so a
# sandboxed agent can reach them (that is how `llm-price-tracker`, an editable
# path dependency, becomes importable at all), and pytest follows symlinks — so
# a bare `pytest` otherwise walks into those repos' test trees and aborts with
# hundreds of collection errors that have nothing to do with gllm. Two links was
# already 221.
testpaths = ["tests"]
norecursedirs = ["symlinks", "git-clones", ".venv", "data", "llms"]
